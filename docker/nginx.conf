server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html e config.js NAO podem ser cacheados: sao a porta de entrada do
  # app e o arquivo de configuracao gerado a cada boot do container. Se o
  # navegador guardar uma versao antiga, um deploy novo (ou uma troca de senha)
  # nao tem efeito visivel -- o usuario continua rodando o app anterior.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # Assets do Vite tem hash no nome: podem ser cacheados agressivamente, porque
  # qualquer mudanca gera um nome de arquivo diferente.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: qualquer rota desconhecida devolve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
